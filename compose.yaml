services:
  game:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      TRUST_PROXY: '1'
      DATA_DIR: /app/data
      CLIENT_DIR: /app/packages/client/dist
      MAX_ROOMS: ${MAX_ROOMS:-100}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_SUPPORT_CHAT_ID: ${TELEGRAM_SUPPORT_CHAT_ID:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-1}
      TELEGRAM_PREMIUM_STARS: ${TELEGRAM_PREMIUM_STARS:-250}
      TELEGRAM_PREMIUM_DAYS: ${TELEGRAM_PREMIUM_DAYS:-30}
      TELEGRAM_REFERRAL_REWARD: ${TELEGRAM_REFERRAL_REWARD:-150}
      TELEGRAM_REFERRAL_WELCOME: ${TELEGRAM_REFERRAL_WELCOME:-75}
    volumes:
      - game-data:/app/data
    expose:
      - '8787'
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      game:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  game-data:
  caddy-data:
  caddy-config:
