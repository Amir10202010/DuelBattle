name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nothing below needs a prior build: typecheck resolves the shared package
      # through tsconfig paths, tests through a vitest alias, and `npm run build`
      # builds it itself. A clean checkout is the only state CI ever sees, and it
      # should be the state everything is verified in.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Proves the single-process deployment the README describes actually
      # serves the app, not just that the pieces compile.
      - name: Smoke test the production server
        run: |
          CLIENT_DIR=packages/client/dist PORT=8787 node packages/server/dist/index.js &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/healthz | tee /dev/stderr | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8787/ | grep -q '<div id="root">'
